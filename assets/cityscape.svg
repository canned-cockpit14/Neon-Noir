<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1334" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Sky / haze gradient -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#5e4a7d"/>
      <stop offset="35%" stop-color="#42365e"/>
      <stop offset="70%" stop-color="#2a1f47"/>
      <stop offset="100%" stop-color="#160d2a"/>
    </linearGradient>

    <!-- Wet street -->
    <linearGradient id="street" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1a1230" stop-opacity="0"/>
      <stop offset="40%"  stop-color="#1f1538"/>
      <stop offset="100%" stop-color="#0a0612"/>
    </linearGradient>

    <!-- Reflective puddle highlights -->
    <linearGradient id="puddle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ff7ac4" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#5b8cff" stop-opacity="0"/>
    </linearGradient>

    <!-- Right-side neon panel glow -->
    <linearGradient id="rightPanel" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%"  stop-color="#ff2e9a" stop-opacity=".9"/>
      <stop offset="50%" stop-color="#7a3cff" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#7a3cff" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft fog band -->
    <radialGradient id="fog" cx="50%" cy="38%" r="60%">
      <stop offset="0%"  stop-color="#b59ce0" stop-opacity=".45"/>
      <stop offset="60%" stop-color="#3a2a5e" stop-opacity=".15"/>
      <stop offset="100%" stop-color="#160d2a" stop-opacity="0"/>
    </radialGradient>

    <!-- Strong blur for the bokeh look -->
    <filter id="blurBig" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="blurMid" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="blurSmall" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>

    <!-- Bokeh dot symbol (radial fade) -->
    <radialGradient id="dotPink">
      <stop offset="0%"  stop-color="#ff5ec4" stop-opacity=".95"/>
      <stop offset="60%" stop-color="#ff2e9a" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#ff2e9a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dotCyan">
      <stop offset="0%"  stop-color="#a5f3ff" stop-opacity=".95"/>
      <stop offset="60%" stop-color="#22e5ff" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#22e5ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dotViolet">
      <stop offset="0%"  stop-color="#c7a8ff" stop-opacity=".95"/>
      <stop offset="60%" stop-color="#7a3cff" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#7a3cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dotAmber">
      <stop offset="0%"  stop-color="#ffd27a" stop-opacity=".95"/>
      <stop offset="60%" stop-color="#ff6a00" stop-opacity=".4"/>
      <stop offset="100%" stop-color="#ff6a00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky background -->
  <rect width="750" height="1334" fill="url(#sky)"/>

  <!-- Soft central fog -->
  <rect width="750" height="1334" fill="url(#fog)"/>

  <!-- Distant skyscraper silhouettes (blurred) -->
  <g filter="url(#blurBig)" opacity=".75">
    <!-- back row -->
    <rect x="40"   y="280" width="60"  height="600" fill="#1a1130"/>
    <rect x="110"  y="220" width="90"  height="660" fill="#15102a"/>
    <rect x="210"  y="180" width="70"  height="700" fill="#1c1234"/>
    <rect x="290"  y="160" width="120" height="720" fill="#0f0a22"/>
    <rect x="420"  y="200" width="80"  height="680" fill="#16102d"/>
    <rect x="510"  y="240" width="100" height="640" fill="#1a1232"/>
    <rect x="620"  y="210" width="120" height="670" fill="#120c26"/>
    <!-- tallest spire -->
    <polygon points="300,140 340,160 410,160 350,140" fill="#15102a"/>
  </g>

  <!-- Mid-range buildings (slightly sharper) -->
  <g filter="url(#blurMid)" opacity=".9">
    <rect x="0"    y="380" width="80"  height="500" fill="#0d091c"/>
    <rect x="80"   y="340" width="60"  height="540" fill="#0a0717"/>
    <rect x="160"  y="320" width="70"  height="560" fill="#0d091c"/>
    <rect x="230"  y="360" width="50"  height="520" fill="#0a0717"/>
    <rect x="460"  y="330" width="60"  height="550" fill="#0a0717"/>
    <rect x="540"  y="310" width="90"  height="570" fill="#0d091c"/>
    <rect x="640"  y="350" width="60"  height="530" fill="#0a0717"/>
  </g>

  <!-- Foreground buildings (sharper, darker) -->
  <g opacity=".95">
    <rect x="-20"  y="500" width="120" height="450" fill="#06040f"/>
    <rect x="650"  y="380" width="120" height="600" fill="#06040f"/>
    <!-- right-side neon panel suggestion -->
    <rect x="660" y="350" width="90" height="650" fill="url(#rightPanel)" opacity=".55"/>
    <rect x="700" y="380" width="50" height="600" fill="#ff2e9a" opacity=".22"/>
  </g>

  <!-- Wet street perspective -->
  <polygon points="220,1334 530,1334 430,820 320,820" fill="url(#street)"/>
  <!-- street edge highlights -->
  <polygon points="220,1334 245,1334 360,820 350,820" fill="#3a1f55" opacity=".5"/>
  <polygon points="505,1334 530,1334 400,820 390,820" fill="#3a1f55" opacity=".5"/>
  <!-- puddle reflections -->
  <ellipse cx="375" cy="1180" rx="120" ry="22" fill="url(#puddle)" opacity=".6" filter="url(#blurSmall)"/>
  <ellipse cx="375" cy="1260" rx="160" ry="28" fill="url(#puddle)" opacity=".4" filter="url(#blurSmall)"/>

  <!-- Tall "neon bar" reflected down the street -->
  <rect x="370" y="700" width="10" height="500" fill="#ff2e9a" opacity=".18" filter="url(#blurBig)"/>
  <rect x="370" y="700" width="10" height="500" fill="#22e5ff" opacity=".12" filter="url(#blurBig)"/>

  <!-- Bokeh dot field (the neon "city lights" feel) -->
  <g filter="url(#blurMid)">
    <!-- pink -->
    <circle cx="120" cy="640" r="36" fill="url(#dotPink)"/>
    <circle cx="260" cy="720" r="44" fill="url(#dotPink)"/>
    <circle cx="395" cy="820" r="60" fill="url(#dotPink)"/>
    <circle cx="470" cy="950" r="50" fill="url(#dotPink)"/>
    <circle cx="590" cy="900" r="42" fill="url(#dotPink)"/>
    <circle cx="180" cy="980" r="30" fill="url(#dotPink)"/>
    <circle cx="340" cy="1060" r="38" fill="url(#dotPink)"/>
    <circle cx="640" cy="1080" r="34" fill="url(#dotPink)"/>
    <!-- cyan -->
    <circle cx="200" cy="780" r="40" fill="url(#dotCyan)"/>
    <circle cx="330" cy="900" r="56" fill="url(#dotCyan)"/>
    <circle cx="430" cy="700" r="34" fill="url(#dotCyan)"/>
    <circle cx="520" cy="820" r="42" fill="url(#dotCyan)"/>
    <circle cx="155" cy="880" r="28" fill="url(#dotCyan)"/>
    <circle cx="450" cy="1080" r="46" fill="url(#dotCyan)"/>
    <circle cx="610" cy="1000" r="36" fill="url(#dotCyan)"/>
    <!-- violet -->
    <circle cx="100" cy="760" r="40" fill="url(#dotViolet)"/>
    <circle cx="280" cy="850" r="36" fill="url(#dotViolet)"/>
    <circle cx="500" cy="700" r="30" fill="url(#dotViolet)"/>
    <circle cx="560" cy="1100" r="44" fill="url(#dotViolet)"/>
    <circle cx="250" cy="1100" r="36" fill="url(#dotViolet)"/>
    <!-- amber / car lights bottom-left -->
    <circle cx="80"  cy="1180" r="50" fill="url(#dotAmber)"/>
    <circle cx="130" cy="1230" r="60" fill="url(#dotAmber)"/>
    <circle cx="50"  cy="1260" r="40" fill="url(#dotAmber)"/>
  </g>

  <!-- Closer (sharper) bokeh dots -->
  <g filter="url(#blurSmall)">
    <circle cx="380" cy="950" r="6" fill="#ffffff" opacity=".85"/>
    <circle cx="362" cy="980" r="4" fill="#ff7ac4" opacity=".9"/>
    <circle cx="395" cy="1010" r="5" fill="#22e5ff" opacity=".85"/>
    <circle cx="375" cy="1040" r="6" fill="#ff2e9a" opacity=".9"/>
    <circle cx="358" cy="1080" r="5" fill="#a5f3ff" opacity=".85"/>
    <circle cx="395" cy="1120" r="7" fill="#ff5ec4" opacity=".9"/>
    <circle cx="372" cy="1160" r="6" fill="#7a3cff" opacity=".85"/>
  </g>

  <!-- Rain streaks -->
  <g stroke="#b59ce0" stroke-width="1" opacity=".25">
    <line x1="60"  y1="60"  x2="40"  y2="180"/>
    <line x1="180" y1="40"  x2="155" y2="180"/>
    <line x1="320" y1="20"  x2="290" y2="170"/>
    <line x1="440" y1="60"  x2="410" y2="200"/>
    <line x1="560" y1="40"  x2="530" y2="180"/>
    <line x1="680" y1="80"  x2="650" y2="220"/>
    <line x1="120" y1="240" x2="95"  y2="380"/>
    <line x1="260" y1="220" x2="235" y2="360"/>
    <line x1="400" y1="260" x2="370" y2="400"/>
    <line x1="540" y1="240" x2="510" y2="380"/>
    <line x1="640" y1="280" x2="610" y2="420"/>
  </g>

  <!-- Vignette top + bottom -->
  <rect x="0" y="0" width="750" height="220" fill="url(#sky)" opacity=".55"/>
</svg>
